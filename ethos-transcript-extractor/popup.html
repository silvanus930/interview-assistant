<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root{--panel:#1d2b2f;--raise:rgba(255,255,255,.045);--raise2:rgba(255,255,255,.08);--line:rgba(255,255,255,.08);
    --text:#eef5f6;--muted:rgba(238,245,246,.6);--faint:rgba(238,245,246,.4);--accent:#67e8f9;--accent-ink:#06282d;--err:#fca5a5;--ok:#5eead4;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  *{box-sizing:border-box}
  body{width:340px;margin:0;font:13px/1.45 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--panel);color:var(--text)}
  header{display:flex;align-items:center;gap:9px;padding:14px 16px 10px;font-weight:600;font-size:13.5px}
  header .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px rgba(103,232,249,.16)}
  .sec{padding:12px 16px;border-top:1px solid var(--line)}
  .eyebrow{font:600 10px/1 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--accent);margin-bottom:9px}
  .muted{color:var(--muted);font-size:12px}
  .row{display:flex;gap:6px;margin-top:9px}
  label{display:block;margin:8px 0 4px;color:var(--muted);font-size:12px}
  input{width:100%;background:rgba(0,0,0,.22);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:8px 11px;font:inherit;outline:none}
  input:focus{border-color:rgba(103,232,249,.5)}
  button{flex:1;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:999px;padding:8px 12px;cursor:pointer;
    background:var(--raise2);color:var(--text);font:inherit;font-weight:600;font-size:12.5px}
  button:hover{background:rgba(255,255,255,.13)}
  button.pri{background:var(--accent);color:var(--accent-ink)}
  button.pri:hover{background:#8ef0fb}
  button.ghost{background:transparent;color:var(--muted);flex:none}
  button:disabled{opacity:.45;cursor:default}
  .err{color:var(--err);font-size:12px;margin-top:8px}
  .who{display:flex;align-items:center;gap:10px}
  .who b{display:block;font-size:13px}
  .who .grow{flex:1;min-width:0}
  .who span{font-size:12px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  ul{list-style:none;margin:0;padding:0;max-height:220px;overflow:auto}
  li{display:flex;align-items:center;gap:6px;padding:7px 0;border-bottom:1px solid var(--line)}
  li:last-child{border-bottom:0}
  li .meta{flex:1;min-width:0}
  li .meta div:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  li button{flex:none;padding:4px 9px}
  [hidden]{display:none !important}
</style>
</head>
<body>
  <header><span class="dot"></span>Ethos Copilot</header>

  <div class="sec">
    <div class="eyebrow">Interview Assistant account</div>
    <!-- Sign-in lives here, in the extension's own page, so the password is never typed into the call page. -->
    <form id="signin" hidden>
      <label for="server">Server address</label>
      <input id="server" type="text" placeholder="http://127.0.0.1:8765" autocomplete="off" spellcheck="false">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username">
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password">
      <div class="row"><button id="login" class="pri" type="submit">Sign in</button></div>
      <div id="loginerr" class="err" hidden></div>
    </form>
    <div id="account" class="who" hidden>
      <div class="grow"><b id="who"></b><span id="where"></span></div>
      <button id="logout" class="ghost" type="button">Sign out</button>
    </div>
    <div id="notice" class="err" hidden></div>
  </div>

  <div class="sec">
    <div class="eyebrow">This tab</div>
    <div id="status" class="muted">Checking current tab…</div>
    <div class="row">
      <button id="show" class="pri">Show panel</button>
      <button id="copy">Copy transcript</button>
    </div>
  </div>

  <div class="sec">
    <div class="eyebrow">Saved transcripts</div>
    <ul id="list"></ul>
  </div>
  <script src="popup.js"></script>
</body>
</html>
